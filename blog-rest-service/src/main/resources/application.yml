server:
  port: 8084
  servlet:
    context-path: /blog-service
spring:
  application:
    name: BLOG-SERVICE
  application-context:
    name: BLOG-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/blog_app
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

project:
  image: images/

logging:
  level:
    org.springframework.security: DEBUG
    org.springdoc: DEBUG
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka